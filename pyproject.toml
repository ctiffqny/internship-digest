[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "internship-digest"
version = "0.1.0"
description = "A privacy-conscious internship discovery and matching pipeline"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
internship-digest = "internship_digest.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/internship_digest"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]